<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Task Controls</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Test Task Controls</h1>
        
        <div class="item">
            <div class="item-info">
                <h3>Test Task</h3>
                <div class="item-meta">Test Project • <span class="status-badge status-stopped">stopped</span> • Total time: 0h 0m</div>
            </div>
            <div class="task-controls">
                <button class="btn btn-success btn-small">Start</button>
                <button class="btn btn-warning btn-small" disabled>Pause</button>
                <button class="btn btn-danger btn-small" disabled>Stop</button>
            </div>
            <div class="item-actions">
                <button class="btn btn-secondary btn-small">Edit</button>
                <button class="btn btn-danger btn-small">Delete</button>
            </div>
        </div>
    </div>
</body>
</html>
