<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // GitHub Pages 404 handler for client-side routing
        var l = window.location;
        var path = l.pathname;
        
        // If the path starts with /minimal/, redirect to the React app
        if (path.startsWith('/minimal/')) {
            var reactPath = path.replace('/minimal', '') || '/';
            l.replace('/minimal/?/' + reactPath.slice(1) + (l.search || '') + (l.hash || ''));
        } else {
            // For any other 404, redirect to the main app
            l.replace('/minimal/?/' + path.slice(1) + (l.search || '') + (l.hash || ''));
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
